<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Backyard Traders</title>

  <style>
    :root {
      --background: #f6f6f4;
      --card: #ffffff;
      --text: #181818;
      --muted: #777;
      --border: #e8e8e5;

      --gold: #d09a23;
      --gold-hover: #b58117;

      --dark: #111214;
      --dark-soft: #1b1c1f;

      --green-bg: #e9f7ee;
      --green: #27834f;

      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
    }

    /* =========================
       HERO / CABEÇALHO
    ========================= */

    .hero {
      background:
        radial-gradient(
          circle at 20% 20%,
          #2b2c30 0,
          #17181b 35%,
          #0e0f11 75%
        );

      color: white;
      border-bottom: 3px solid var(--gold);
    }

    .hero-inner {
      max-width: 1220px;
      margin: 0 auto;

      min-height: 240px;
      padding: 34px 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 35px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .logo-box {
      width: 155px;
      height: 155px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }

    .logo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;

      display: none;
    }

    .brand-text h1 {
      margin: 0 0 10px;

      font-size: clamp(32px, 5vw, 48px);
      line-height: 1;
      letter-spacing: -1.5px;
    }

    .brand-text p {
      margin: 0;

      font-size: 18px;
      color: #d6d6d6;
      max-width: 560px;
      line-height: 1.5;
    }

    .contact-area {
      text-align: right;
      display: none;
    }

    .contact-area small {
      display: block;
      color: #aaa;
      margin-bottom: 6px;
    }

    .contact-area strong {
      color: white;
      font-size: 16px;
    }

    /* =========================
       CONTEÚDO
    ========================= */

    .container {
      max-width: 1220px;
      margin: 0 auto;
      padding: 38px 24px 65px;
    }

    .catalog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;

      margin-bottom: 34px;
    }

    .catalog-title h2 {
      margin: 0;
      font-size: 25px;
    }

    .counter {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================
       PESQUISA
    ========================= */

    .search {
      width: min(390px, 100%);
    }

    .search input {
      width: 100%;
      padding: 14px 19px;

      border: 1px solid var(--border);
      border-radius: 30px;

      background: white;
      font-size: 15px;

      outline: none;

      transition: 0.2s;
    }

    .search input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(208,154,35,0.12);
    }

    /* =========================
       GRELHA DE PRODUTOS
    ========================= */

    .catalog {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(245px, 1fr));

      gap: 22px;
    }

    .product {
      background: white;

      border: 1px solid var(--border);
      border-radius: var(--radius);

      overflow: hidden;

      display: flex;
      flex-direction: column;

      box-shadow:
        0 5px 22px rgba(0,0,0,0.05);

      transition:
        transform 0.22s ease,
        box-shadow 0.22s ease;
    }

    .product:hover {
      transform: translateY(-5px);

      box-shadow:
        0 14px 36px rgba(0,0,0,0.10);
    }

    .image-box {
      width: 100%;
      aspect-ratio: 1 / 1;

      background: #f0f0ee;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;

      transition: transform 0.3s ease;
    }

    .product:hover .image-box img {
      transform: scale(1.025);
    }

    .no-image {
      color: #999;
      font-size: 14px;
    }

    .product-body {
      padding: 17px;

      display: flex;
      flex-direction: column;

      flex: 1;
    }

    .product-name {
      margin: 0 0 16px;

      font-size: 16px;
      line-height: 1.4;
      font-weight: 650;
    }

    .product-bottom {
      margin-top: auto;
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 13px;
    }

    .price {
      font-size: 21px;
      font-weight: 750;
    }

    .status {
      padding: 6px 10px;

      border-radius: 20px;

      background: var(--green-bg);
      color: var(--green);

      font-size: 11px;
      font-weight: 650;
    }

    .button {
      display: block;

      width: 100%;

      padding: 12px 15px;

      border-radius: 11px;

      background: var(--gold);
      color: white;

      text-decoration: none;
      text-align: center;

      font-weight: bold;
      font-size: 14px;

      transition: 0.2s;
    }

    .button:hover {
      background: var(--gold-hover);
    }

    /* =========================
       MENSAGENS
    ========================= */

    .message {
      text-align: center;
      color: var(--muted);
      padding: 35px 10px;
    }

    /* =========================
       RODAPÉ
    ========================= */

    footer {
      background: var(--dark);
      color: #aaa;

      padding: 30px 20px;

      text-align: center;
      font-size: 13px;
    }

    footer strong {
      color: white;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 750px) {

      .hero-inner {
        flex-direction: column;
        text-align: center;
      }

      .brand {
        flex-direction: column;
      }

      .logo-box {
        width: 135px;
        height: 135px;
      }

      .contact-area {
        text-align: center;
      }

      .catalog-header {
        flex-direction: column;
        align-items: stretch;
      }

      .search {
        width: 100%;
      }

      .catalog {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 12px;
      }

      .product-body {
        padding: 13px;
      }

      .product-name {
        font-size: 14px;
      }

      .price {
        font-size: 18px;
      }

      .status {
        display: none;
      }

    }

    @media (max-width: 420px) {

      .catalog {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>


<body>

<header class="hero">

  <div class="hero-inner">

    <div class="brand">

      <div class="logo-box">
        <img
          id="logo"
          class="logo"
          alt="Logótipo da loja"
        >
      </div>

      <div class="brand-text">

        <h1 id="storeName">
          Backyard Traders
        </h1>

        <p id="subtitle">
          Artigos selecionados a bons preços
        </p>

      </div>

    </div>


    <div
      id="contactArea"
      class="contact-area"
    >

      <small>Contacto</small>

      <strong id="contact"></strong>

    </div>

  </div>

</header>



<main class="container">

  <div class="catalog-header">

    <div class="catalog-title">

      <h2>Os nossos artigos</h2>

      <div
        id="counter"
        class="counter"
      >
        A carregar catálogo...
      </div>

    </div>


    <div class="search">

      <input
        id="searchInput"
        type="search"
        placeholder="Pesquisar artigos..."
      >

    </div>

  </div>


  <div
    id="message"
    class="message"
  >
    A carregar artigos...
  </div>


  <section
    id="catalog"
    class="catalog"
  ></section>

</main>



<footer>

  <strong id="footerName">
    Backyard Traders
  </strong>

  · Catálogo online

</footer>



<script>

/* =====================================================
   GOOGLE SHEETS
===================================================== */


/*
   ESTE É O TEU LINK ATUAL DOS PRODUTOS.
   NÃO ALTERAR.
*/

const CSV_PRODUCTS =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRbU1RthfXL6QBD0NgNVJYVgxBwIm4mldrzXSZRsjd8TQIhCOf4YeOiq1NiOW1oaNRysD173Y_ZXBJN/pub?gid=0&single=true&output=csv";


/*
   AQUI VAIS COLOCAR O NOVO LINK CSV
   DA ABA CONFIG.
*/

const CSV_CONFIG =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRbU1RthfXL6QBD0NgNVJYVgxBwIm4mldrzXSZRsjd8TQIhCOf4YeOiq1NiOW1oaNRysD173Y_ZXBJN/pub?gid=374003126&single=true&output=csv";



/* =====================================================
   LER CSV
===================================================== */

function parseCSV(text) {

  const rows = [];

  let row = [];
  let field = "";
  let quoted = false;


  for (let i = 0; i < text.length; i++) {

    const char = text[i];
    const next = text[i + 1];


    if (
      char === '"' &&
      quoted &&
      next === '"'
    ) {

      field += '"';
      i++;

    }

    else if (char === '"') {

      quoted = !quoted;

    }

    else if (
      char === "," &&
      !quoted
    ) {

      row.push(field);
      field = "";

    }

    else if (
      (char === "\n" || char === "\r") &&
      !quoted
    ) {

      if (
        char === "\r" &&
        next === "\n"
      ) {

        i++;

      }


      row.push(field);

      field = "";


      if (
        row.some(
          value =>
            value.trim() !== ""
        )
      ) {

        rows.push(row);

      }


      row = [];

    }

    else {

      field += char;

    }

  }


  row.push(field);


  if (
    row.some(
      value =>
        value.trim() !== ""
    )
  ) {

    rows.push(row);

  }


  return rows;

}



/* =====================================================
   CONFIG
===================================================== */

async function loadConfig() {

  if (
    !CSV_CONFIG ||
    CSV_CONFIG.includes(
      "COLOCA_AQUI"
    )
  ) {

    console.warn(
      "Ainda não foi definido CSV_CONFIG."
    );

    return;

  }


  try {

    const response =
      await fetch(CSV_CONFIG);


    if (!response.ok) {

      throw new Error(
        "Erro ao carregar Config."
      );

    }


    const text =
      await response.text();


    const rows =
      parseCSV(text);


    const config = {};


    /*
      FORMATO ESPERADO:

      Nome da loja | Backyard Traders
      Logotipo     | logo.png
      Subtítulo    | ...
      Contacto     | ...
    */


    rows.forEach(row => {

      const key =
        (row[0] || "")
          .trim()
          .toLowerCase();


      const value =
        (row[1] || "")
          .trim();


      if (key) {

        config[key] = value;

      }

    });



    /* NOME */

    if (config["nome da loja"]) {

      document.getElementById(
        "storeName"
      ).textContent =
        config["nome da loja"];


      document.getElementById(
        "footerName"
      ).textContent =
        config["nome da loja"];


      document.title =
        config["nome da loja"];

    }



    /* SUBTÍTULO */

    if (config["subtítulo"]) {

      document.getElementById(
        "subtitle"
      ).textContent =
        config["subtítulo"];

    }



    /* LOGÓTIPO */

    if (config["logotipo"]) {

      const logo =
        document.getElementById(
          "logo"
        );


      logo.src =
        config["logotipo"];


      logo.onload = () => {

        logo.style.display =
          "block";

      };


      logo.onerror = () => {

        console.warn(
          "Não foi possível carregar o logótipo."
        );

      };

    }



    /* CONTACTO */

    if (config["contacto"]) {

      document.getElementById(
        "contact"
      ).textContent =
        config["contacto"];


      document.getElementById(
        "contactArea"
      ).style.display =
        "block";

    }

  }

  catch (error) {

    console.warn(
      "Erro na configuração:",
      error
    );

  }

}



/* =====================================================
   PRODUTOS
===================================================== */

let allProducts = [];


async function loadProducts() {

  try {

    const response =
      await fetch(CSV_PRODUCTS);


    if (!response.ok) {

      throw new Error(
        "Erro ao carregar produtos."
      );

    }


    const text =
      await response.text();


    const rows =
      parseCSV(text);


    if (rows.length < 2) {

      throw new Error(
        "Não existem produtos."
      );

    }


    const headers =
      rows[0].map(
        header =>
          header.trim()
      );


    allProducts =
      rows
        .slice(1)

        .map(values => {

          const product = {};


          headers.forEach(
            (header, index) => {

              product[header] =
                (
                  values[index]
                  || ""
                ).trim();

            }
          );


          return product;

        })

        .filter(product => {

          const name =
            product["Produto"]
            || "";


          const status =
            product["Disponibilidade"]
            || "";


          if (!name) {

            return false;

          }


          if (
            status &&
            status
              .toLowerCase() !==
              "disponível"
          ) {

            return false;

          }


          return true;

        });


    renderProducts(
      allProducts
    );

  }

  catch (error) {

    document.getElementById(
      "message"
    ).textContent =
      "Não foi possível carregar os artigos.";


    document.getElementById(
      "counter"
    ).textContent =
      "";


    console.error(error);

  }

}



/* =====================================================
   MOSTRAR PRODUTOS
===================================================== */

function renderProducts(products) {

  const catalog =
    document.getElementById(
      "catalog"
    );


  const message =
    document.getElementById(
      "message"
    );


  catalog.innerHTML = "";

  message.textContent = "";


  products.forEach(product => {

    const name =
      product["Produto"]
      || "";


    const price =
      product["Preço venda"]
      || "";


    const image =
      product["Imagem"]
      || "";


    const status =
      product["Disponibilidade"]
      || "Disponível";


    const salesLink =
      product["Link Venda"]
      || "";


    const card =
      document.createElement(
        "article"
      );


    card.className =
      "product";



    /* IMAGEM */

    const imageBox =
      document.createElement(
        "div"
      );


    imageBox.className =
      "image-box";


    if (image) {

      const img =
        document.createElement(
          "img"
        );


      img.src = image;

      img.alt = name;

      img.loading = "lazy";


      img.onerror = () => {

        imageBox.innerHTML =
          '<span class="no-image">Imagem indisponível</span>';

      };


      imageBox.appendChild(
        img
      );

    }

    else {

      imageBox.innerHTML =
        '<span class="no-image">Sem imagem</span>';

    }



    /* CORPO */

    const body =
      document.createElement(
        "div"
      );


    body.className =
      "product-body";



    const title =
      document.createElement(
        "h3"
      );


    title.className =
      "product-name";


    title.textContent =
      name;



    const bottom =
      document.createElement(
        "div"
      );


    bottom.className =
      "product-bottom";



    const priceRow =
      document.createElement(
        "div"
      );


    priceRow.className =
      "price-row";



    const priceElement =
      document.createElement(
        "span"
      );


    priceElement.className =
      "price";


    priceElement.textContent =
      price;



    const statusElement =
      document.createElement(
        "span"
      );


    statusElement.className =
      "status";


    statusElement.textContent =
      status;



    priceRow.appendChild(
      priceElement
    );


    priceRow.appendChild(
      statusElement
    );


    bottom.appendChild(
      priceRow
    );



    /* LINK */

    if (salesLink) {

      const button =
        document.createElement(
          "a"
        );


      button.className =
        "button";


      button.href =
        salesLink;


      button.target =
        "_blank";


      button.rel =
        "noopener noreferrer";


      button.textContent =
        "Ver artigo";


      bottom.appendChild(
        button
      );

    }



    body.appendChild(
      title
    );


    body.appendChild(
      bottom
    );


    card.appendChild(
      imageBox
    );


    card.appendChild(
      body
    );


    catalog.appendChild(
      card
    );

  });



  updateCounter(
    products.length
  );


  if (!products.length) {

    message.textContent =
      "Não foram encontrados artigos.";

  }

}



/* =====================================================
   CONTADOR
===================================================== */

function updateCounter(number) {

  document.getElementById(
    "counter"
  ).textContent =

    number === 1

      ? "1 artigo disponível"

      : number +
        " artigos disponíveis";

}



/* =====================================================
   PESQUISA
===================================================== */

document.getElementById(
  "searchInput"
).addEventListener(
  "input",
  function () {

    const query =
      this.value
        .trim()
        .toLowerCase();


    if (!query) {

      renderProducts(
        allProducts
      );

      return;

    }


    const results =
      allProducts.filter(
        product => {

          const name =
            (
              product["Produto"]
              || ""
            ).toLowerCase();


          return name.includes(
            query
          );

        }
      );


    renderProducts(
      results
    );

  }
);



/* =====================================================
   INICIAR SITE
===================================================== */

loadConfig();

loadProducts();

</script>

</body>
</html>
