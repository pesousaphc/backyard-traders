<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#101113"
  >

  <title>Backyard Traders</title>

  <style>

    :root {
      --ink: #101113;
      --ink-soft: #1b1c1f;

      --gold: #d59a1f;
      --gold-light: #f2c75c;
      --gold-dark: #a96f08;

      --cream: #faf9f6;
      --surface: #ffffff;
      --surface-soft: #f3f2ee;

      --text: #171717;
      --muted: #747474;
      --border: #e7e4dc;

      --green: #287c50;
      --green-bg: #e7f6ed;

      --radius: 20px;

      --shadow:
        0 6px 22px rgba(0,0,0,.055);

      --shadow-hover:
        0 18px 46px rgba(0,0,0,.11);
    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: var(--cream);
      color: var(--text);

      -webkit-font-smoothing: antialiased;
    }


    button,
    input,
    select {
      font: inherit;
    }



    /* =====================================================
       HERO
    ===================================================== */

    .hero {
      position: relative;
      overflow: hidden;

      color: white;

      background:
        radial-gradient(
          circle at 82% 12%,
          rgba(213,154,31,.20),
          transparent 31%
        ),
        radial-gradient(
          circle at 15% 85%,
          rgba(255,255,255,.06),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #242529,
          #111214 50%,
          #090a0b
        );

      border-bottom:
        2px solid rgba(213,154,31,.65);
    }


    .hero-shell {
      max-width: 1240px;
      margin: auto;

      padding:
        24px 25px
        52px;
    }


    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;

      padding-bottom: 18px;
      margin-bottom: 37px;

      border-bottom:
        1px solid rgba(255,255,255,.10);
    }


    .mini-brand {
      display: flex;
      align-items: center;
      gap: 9px;

      color: rgba(255,255,255,.70);

      text-transform: uppercase;
      letter-spacing: .12em;

      font-size: 11px;
      font-weight: 800;
    }


    .mini-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--gold);

      box-shadow:
        0 0 14px rgba(213,154,31,.9);
    }


    .contact {
      display: none;

      padding: 9px 14px;

      border:
        1px solid rgba(255,255,255,.14);

      border-radius: 999px;

      color:
        rgba(255,255,255,.82);

      background:
        rgba(255,255,255,.05);

      font-size: 12px;
    }


    .hero-main {
      display: grid;

      grid-template-columns:
        minmax(0,1fr)
        290px;

      align-items: center;

      gap: 65px;
    }


    .eyebrow {
      display: flex;
      align-items: center;

      gap: 10px;

      margin-bottom: 15px;

      color: var(--gold-light);

      text-transform: uppercase;
      letter-spacing: .14em;

      font-size: 11px;
      font-weight: 850;
    }


    .eyebrow::before {
      content: "";

      width: 30px;
      height: 1px;

      background: var(--gold);
    }


    .hero-copy h1 {
      max-width: 740px;

      margin: 0;

      font-size:
        clamp(42px, 6vw, 67px);

      line-height: .98;

      letter-spacing: -.045em;

      font-weight: 850;
    }


    .hero-copy h1 span {
      color: var(--gold-light);
    }


    .hero-copy p {
      max-width: 640px;

      margin:
        21px 0 0;

      color:
        rgba(255,255,255,.67);

      line-height: 1.65;

      font-size: 17px;
    }


    .hero-actions {
      margin-top: 27px;

      display: flex;
      flex-wrap: wrap;
      align-items: center;

      gap: 14px;
    }


    .hero-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;

      min-height: 47px;

      padding:
        0 21px;

      border-radius: 999px;

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );

      color: #16120a;

      text-decoration: none;

      font-size: 13px;
      font-weight: 850;

      transition: .2s;
    }


    .hero-button:hover {
      transform: translateY(-2px);
    }


    .hero-total {
      color:
        rgba(255,255,255,.58);

      font-size: 12px;
    }



    /* =====================================================
       LOGÓTIPO
    ===================================================== */

    .crest-area {
      display: flex;
      justify-content: center;
    }


    .crest {
      width: 235px;
      height: 235px;

      padding: 6px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          145deg,
          #f6d070,
          #93600c
        );

      box-shadow:
        0 30px 65px rgba(0,0,0,.38),
        0 0 0 8px rgba(213,154,31,.06);
    }


    .crest-inner {
      width: 100%;
      height: 100%;

      overflow: hidden;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111;
    }


    .crest img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 50%;

      transform: scale(1.04);

      display: none;
    }



    /* =====================================================
       CONTROLOS
    ===================================================== */

    .controls-wrap {
      position: sticky;
      top: 0;

      z-index: 30;

      background:
        rgba(250,249,246,.94);

      backdrop-filter: blur(15px);

      border-bottom:
        1px solid rgba(0,0,0,.06);
    }


    .controls {
      max-width: 1240px;
      margin: auto;

      padding:
        16px 25px;
    }


    .controls-row {
      display: grid;

      grid-template-columns:
        1fr
        minmax(270px,400px);

      gap: 22px;

      align-items: center;
    }


    .catalog-info h2 {
      margin: 0;

      font-size: 22px;

      letter-spacing: -.02em;
    }


    .counter {
      margin-top: 5px;

      color: var(--muted);

      font-size: 12px;
    }


    .search-box {
      position: relative;
    }


    .search-box span {
      position: absolute;

      left: 16px;
      top: 50%;

      transform:
        translateY(-50%);

      opacity: .45;
    }


    .search-box input {
      width: 100%;
      height: 47px;

      padding:
        0 18px
        0 44px;

      border:
        1px solid var(--border);

      border-radius: 999px;

      outline: none;

      background: white;

      box-shadow:
        0 3px 13px rgba(0,0,0,.03);
    }


    .search-box input:focus {
      border-color: var(--gold);

      box-shadow:
        0 0 0 4px
        rgba(213,154,31,.10);
    }



    /* =====================================================
       FILTROS + ORDENAÇÃO
    ===================================================== */

    .toolbar {
      max-width: 1240px;
      margin: auto;

      padding:
        18px 25px 3px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;
    }


    .categories {
      display: flex;
      gap: 8px;

      overflow-x: auto;

      scrollbar-width: none;
    }


    .categories::-webkit-scrollbar {
      display: none;
    }


    .category-button {
      flex: 0 0 auto;

      padding:
        9px 14px;

      border:
        1px solid var(--border);

      border-radius: 999px;

      background: white;

      color: #555;

      cursor: pointer;

      font-size: 12px;
      font-weight: 650;
    }


    .category-button.active {
      background: var(--ink);
      color: white;

      border-color: var(--ink);
    }


    .selectors {
      display: flex;
      align-items: center;

      gap: 9px;

      flex-shrink: 0;
    }


    .select-wrap {
      display: flex;
      align-items: center;

      gap: 7px;

      color: var(--muted);

      font-size: 11px;
    }


    select {
      height: 38px;

      padding:
        0 32px
        0 12px;

      border:
        1px solid var(--border);

      border-radius: 10px;

      background: white;

      color: var(--text);

      cursor: pointer;

      outline: none;
    }



    /* =====================================================
       CATÁLOGO
    ===================================================== */

    .main {
      max-width: 1240px;

      margin: auto;

      padding:
        26px 25px
        65px;
    }


    .catalog {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(245px,1fr)
        );

      gap:
        23px 20px;
    }



    /* =====================================================
       CARTÃO
    ===================================================== */

    .product {
      position: relative;

      overflow: hidden;

      display: flex;
      flex-direction: column;

      background: var(--surface);

      border:
        1px solid var(--border);

      border-radius: var(--radius);

      box-shadow: var(--shadow);

      transition: .22s;
    }


    .product:hover {
      transform:
        translateY(-4px);

      box-shadow:
        var(--shadow-hover);

      border-color:
        #dfd8c8;
    }


    .image-box {
      position: relative;

      aspect-ratio: 1 / 1;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        var(--surface-soft);
    }


    .image-box img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transition:
        transform .4s;
    }


    .product:hover img {
      transform:
        scale(1.035);
    }


    .category-badge {
      position: absolute;

      left: 12px;
      top: 12px;

      z-index: 2;

      padding:
        6px 9px;

      border-radius: 999px;

      background:
        rgba(15,16,18,.78);

      color: white;

      backdrop-filter:
        blur(8px);

      font-size: 10px;
      font-weight: 700;
    }


    .quantity-badge {
      position: absolute;

      right: 12px;
      top: 12px;

      z-index: 2;

      padding:
        6px 9px;

      border-radius: 999px;

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );

      color: #241b09;

      box-shadow:
        0 5px 15px rgba(0,0,0,.15);

      font-size: 10px;
      font-weight: 850;
    }


    .no-image {
      color: #999;

      font-size: 13px;
    }


    .product-body {
      min-height: 175px;

      padding: 16px;

      display: flex;
      flex-direction: column;
    }


    .product-name {
      margin:
        0 0 17px;

      font-size: 15px;

      line-height: 1.42;

      font-weight: 680;
    }


    .product-footer {
      margin-top: auto;
    }


    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 10px;

      margin-bottom: 13px;
    }


    .price {
      font-size: 21px;
      font-weight: 850;

      letter-spacing: -.025em;
    }


    .status {
      display: inline-flex;
      align-items: center;

      gap: 5px;

      padding:
        6px 9px;

      border-radius: 999px;

      background:
        var(--green-bg);

      color: var(--green);

      font-size: 10px;
      font-weight: 750;
    }


    .status::before {
      content: "";

      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: currentColor;
    }


    .product-button {
      width: 100%;

      min-height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 0;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #e1a92d,
          #c28410
        );

      color: white;

      text-decoration: none;

      cursor: pointer;

      font-size: 12px;
      font-weight: 800;
    }


    .product-button:hover {
      background:
        linear-gradient(
          135deg,
          #d59a1f,
          #a96f08
        );
    }


    .links-list {
      display: none;

      margin-top: 9px;

      padding-top: 9px;

      border-top:
        1px solid var(--border);
    }


    .links-list.open {
      display: grid;

      gap: 6px;
    }


    .links-list a {
      padding:
        8px 10px;

      border:
        1px solid var(--border);

      border-radius: 8px;

      color: #4d4d4d;

      background: #fafafa;

      text-decoration: none;

      font-size: 11px;
    }


    .links-list a:hover {
      border-color: var(--gold);
    }



    /* =====================================================
       PAGINAÇÃO
    ===================================================== */

    .pagination {
      margin-top: 38px;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 7px;

      flex-wrap: wrap;
    }


    .page-button {
      min-width: 39px;
      height: 39px;

      padding:
        0 11px;

      border:
        1px solid var(--border);

      border-radius: 10px;

      background: white;

      color: #444;

      cursor: pointer;

      font-size: 12px;
      font-weight: 650;
    }


    .page-button:hover {
      border-color: var(--gold);
    }


    .page-button.active {
      background: var(--ink);
      color: white;

      border-color: var(--ink);
    }


    .page-button:disabled {
      opacity: .35;

      cursor: default;
    }



    /* =====================================================
       MENSAGEM
    ===================================================== */

    .message {
      padding:
        40px 10px;

      color: var(--muted);

      text-align: center;
    }



    /* =====================================================
       FOOTER
    ===================================================== */

    footer {
      padding:
        32px 20px;

      background: var(--ink);

      color:
        rgba(255,255,255,.45);

      text-align: center;

      border-top:
        2px solid rgba(213,154,31,.6);

      font-size: 12px;
    }


    footer strong {
      color:
        rgba(255,255,255,.85);
    }



    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 850px) {

      .hero-main {
        grid-template-columns: 1fr;

        text-align: center;
      }


      .crest-area {
        order: 1;
      }


      .hero-copy {
        order: 2;
      }


      .eyebrow {
        justify-content: center;
      }


      .hero-copy p {
        margin-left: auto;
        margin-right: auto;
      }


      .hero-actions {
        justify-content: center;
      }


      .crest {
        width: 185px;
        height: 185px;
      }


      .controls-row {
        grid-template-columns: 1fr;
      }


      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }


      .selectors {
        justify-content: space-between;
      }

    }


    @media (max-width: 650px) {

      .hero-shell {
        padding:
          17px 17px
          38px;
      }


      .hero-copy h1 {
        font-size: 42px;
      }


      .hero-copy p {
        font-size: 15px;
      }


      .controls {
        padding:
          14px 15px;
      }


      .toolbar {
        padding:
          15px 15px
          2px;
      }


      .main {
        padding:
          20px 14px
          55px;
      }


      .catalog {
        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );

        gap: 12px;
      }


      .product {
        border-radius: 15px;
      }


      .product-body {
        min-height: 155px;

        padding: 12px;
      }


      .product-name {
        font-size: 13px;
      }


      .price {
        font-size: 18px;
      }


      .status {
        display: none;
      }


      .select-wrap label {
        display: none;
      }

    }


    @media (max-width: 390px) {

      .catalog {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>

<script>

/* =====================================================
   GOOGLE SHEETS
===================================================== */

const CSV_PRODUCTS =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRbU1RthfXL6QBD0NgNVJYVgxBwIm4mldrzXSZRsjd8TQIhCOf4YeOiq1NiOW1oaNRysD173Y_ZXBJN/pub?gid=0&single=true&output=csv";


const CSV_CONFIG =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRbU1RthfXL6QBD0NgNVJYVgxBwIm4mldrzXSZRsjd8TQIhCOf4YeOiq1NiOW1oaNRysD173Y_ZXBJN/pub?gid=374003126&single=true&output=csv";



/* =====================================================
   ESTADO
===================================================== */

let allProducts = [];

let filteredProducts = [];

let activeCategory = "Todos";

let searchQuery = "";

let sortMode = "default";

let pageSize = 20;

let currentPage = 1;



/* =====================================================
   CSV
===================================================== */

function parseCSV(text) {

  const rows = [];

  let row = [];
  let field = "";
  let quoted = false;


  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    const char = text[i];
    const next = text[i + 1];


    if (
      char === '"' &&
      quoted &&
      next === '"'
    ) {

      field += '"';

      i++;

    }

    else if (
      char === '"'
    ) {

      quoted = !quoted;

    }

    else if (
      char === "," &&
      !quoted
    ) {

      row.push(field);

      field = "";

    }

    else if (
      (
        char === "\n" ||
        char === "\r"
      ) &&
      !quoted
    ) {

      if (
        char === "\r" &&
        next === "\n"
      ) {

        i++;

      }


      row.push(field);

      field = "";


      if (
        row.some(
          value =>
            value.trim() !== ""
        )
      ) {

        rows.push(row);

      }


      row = [];

    }

    else {

      field += char;

    }

  }


  row.push(field);


  if (
    row.some(
      value =>
        value.trim() !== ""
    )
  ) {

    rows.push(row);

  }


  return rows;

}



/* =====================================================
   NORMALIZAÇÃO
===================================================== */

function normalizeText(value) {

  return (value || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /\s+/g,
      " "
    );

}



/* =====================================================
   PREÇO
===================================================== */

function parsePrice(value) {

  if (!value) {
    return 0;
  }


  const cleaned =
    value
      .replace(/[^\d,.-]/g, "")
      .replace(/\./g, "")
      .replace(",", ".");


  const number =
    parseFloat(cleaned);


  return Number.isFinite(number)
    ? number
    : 0;

}



/* =====================================================
   CONFIG
===================================================== */

async function loadConfig() {

  try {

    const response =
      await fetch(CSV_CONFIG);


    const text =
      await response.text();


    const rows =
      parseCSV(text);


    const config = {};


    rows.forEach(row => {

      const key =
        normalizeText(
          row[0]
        );


      const value =
        (row[1] || "")
          .trim();


      if (key) {

        config[key] =
          value;

      }

    });



    if (
      config["nome da loja"]
    ) {

      const name =
        config["nome da loja"];


      document.title =
        name;


      document
        .getElementById(
          "footerName"
        )
        .textContent =
          name;


      renderStoreName(
        name
      );

    }



    if (
      config["subtitulo"]
    ) {

      document
        .getElementById(
          "subtitle"
        )
        .textContent =
          config["subtitulo"];

    }



    if (
      config["logotipo"]
    ) {

      const logo =
        document
          .getElementById(
            "logo"
          );


      logo.src =
        config["logotipo"];


      logo.onload =
        () => {

          logo.style.display =
            "block";

        };

    }



    if (
      config["contacto"]
    ) {

      document
        .getElementById(
          "contact"
        )
        .textContent =
          config["contacto"];


      document
        .getElementById(
          "contactArea"
        )
        .style.display =
          "block";

    }

  }

  catch (error) {

    console.warn(
      "Config não carregada.",
      error
    );

  }

}



function renderStoreName(name) {

  const words =
    name.trim().split(/\s+/);


  const last =
    words.pop();


  const first =
    words.join(" ");


  document
    .getElementById(
      "storeName"
    )
    .innerHTML =
      first
      +
      (
        first
          ? " "
          : ""
      )
      +
      "<span>"
      +
      last
      +
      "</span>";

}



/* =====================================================
   CARREGAR PRODUTOS
===================================================== */

async function loadProducts() {

  try {

    const response =
      await fetch(
        CSV_PRODUCTS
      );


    const text =
      await response.text();


    const rows =
      parseCSV(text);


    const headers =
      rows[0].map(
        header =>
          header.trim()
      );


    const rawProducts =
      rows
        .slice(1)

        .map(values => {

          const product = {};


          headers.forEach(
            (
              header,
              index
            ) => {

              product[header] =
                (
                  values[index]
                  || ""
                ).trim();

            }
          );


          return product;

        })

        .filter(product => {

          const name =
            product[
              "Produto"
            ] || "";


          const status =
            product[
              "Disponibilidade"
            ] || "";


          if (!name) {
            return false;
          }


          if (
            status &&
            normalizeText(status)
              !==
              "disponivel"
          ) {

            return false;

          }


          return true;

        });


    allProducts =
      groupDuplicates(
        rawProducts
      );


    buildCategories();


    applyFilters();


    updateHeroTotal();

  }

  catch (error) {

    console.error(error);


    document
      .getElementById(
        "message"
      )
      .textContent =
        "Não foi possível carregar os artigos.";

  }

}



/* =====================================================
   AGRUPAR REPETIDOS
===================================================== */

function groupDuplicates(products) {

  const groups =
    new Map();


  products.forEach(product => {

    const name =
      normalizeText(
        product[
          "Produto"
        ]
      );


    const description =
      normalizeText(
        product[
          "Descrição"
        ]
      );


    /*
      Se existir Descrição,
      também entra na comparação.

      Caso não exista,
      basta o nome Produto.
    */

    const key =
      description
        ? name + "|" + description
        : name;


    if (
      !groups.has(key)
    ) {

      groups.set(
        key,
        {
          ...product,

          quantity: 0,

          links: [],

          prices: [],

          images: []
        }
      );

    }


    const group =
      groups.get(key);


    group.quantity++;


    const salesLink =
      product[
        "Link Venda"
      ];


    if (
      salesLink &&
      !group.links.includes(
        salesLink
      )
    ) {

      group.links.push(
        salesLink
      );

    }


    const price =
      parsePrice(
        product[
          "Preço venda"
        ]
      );


    if (
      Number.isFinite(price)
    ) {

      group.prices.push(
        price
      );

    }


    const image =
      product["Imagem"];


    if (
      image &&
      !group.images.includes(
        image
      )
    ) {

      group.images.push(
        image
      );

    }

  });


  return [
    ...groups.values()
  ];

}



/* =====================================================
   CATEGORIAS
===================================================== */

function buildCategories() {

  const container =
    document
      .getElementById(
        "categories"
      );


  const categories =
    [
      ...new Set(

        allProducts
          .map(
            product =>
              (
                product[
                  "Categoria"
                ] || ""
              ).trim()
          )
          .filter(Boolean)

      )
    ]
    .sort(
      (a,b) =>
        a.localeCompare(
          b,
          "pt"
        )
    );


  container.innerHTML =
    "";


  createCategoryButton(
    "Todos",
    container,
    true
  );


  categories.forEach(
    category => {

      createCategoryButton(
        category,
        container,
        false
      );

    }
  );

}



function createCategoryButton(
  category,
  container,
  active
) {

  const button =
    document
      .createElement(
        "button"
      );


  button.className =
    "category-button"
    +
    (
      active
        ? " active"
        : ""
    );


  button.textContent =
    category;


  button.onclick =
    () => {

      activeCategory =
        category;


      currentPage =
        1;


      document
        .querySelectorAll(
          ".category-button"
        )
        .forEach(
          element =>
            element.classList
              .remove(
                "active"
              )
        );


      button.classList.add(
        "active"
      );


      applyFilters();

    };


  container.appendChild(
    button
  );

}



/* =====================================================
   FILTRAR
===================================================== */

function applyFilters() {

  filteredProducts =
    allProducts.filter(
      product => {

        const name =
          normalizeText(
            product[
              "Produto"
            ]
          );


        const description =
          normalizeText(
            product[
              "Descrição"
            ]
          );


        const category =
          (
            product[
              "Categoria"
            ] || ""
          ).trim();


        const searchMatch =
          !searchQuery
          ||
          name.includes(
            searchQuery
          )
          ||
          description.includes(
            searchQuery
          );


        const categoryMatch =
          activeCategory ===
            "Todos"
          ||
          category ===
            activeCategory;


        return (
          searchMatch
          &&
          categoryMatch
        );

      }
    );


  sortProducts();


  renderPage();

}



/* =====================================================
   ORDENAÇÃO
===================================================== */

function getProductPrice(product) {

  if (
    product.prices &&
    product.prices.length
  ) {

    return Math.min(
      ...product.prices
    );

  }


  return parsePrice(
    product[
      "Preço venda"
    ]
  );

}



function sortProducts() {

  if (
    sortMode ===
      "price-asc"
  ) {

    filteredProducts.sort(
      (a,b) =>
        getProductPrice(a)
        -
        getProductPrice(b)
    );

  }


  else if (
    sortMode ===
      "price-desc"
  ) {

    filteredProducts.sort(
      (a,b) =>
        getProductPrice(b)
        -
        getProductPrice(a)
    );

  }


  else if (
    sortMode ===
      "name-asc"
  ) {

    filteredProducts.sort(
      (a,b) =>
        (
          a["Produto"] || ""
        )
        .localeCompare(
          b["Produto"] || "",
          "pt"
        )
    );

  }

}



/* =====================================================
   PREÇO VISUAL
===================================================== */

function formatNumberEUR(number) {

  return number.toLocaleString(
    "pt-PT",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  )
  +
  " €";

}



function getPriceLabel(product) {

  const prices =
    product.prices || [];


  if (!prices.length) {

    return (
      product[
        "Preço venda"
      ] || ""
    );

  }


  const min =
    Math.min(...prices);


  const max =
    Math.max(...prices);


  if (
    Math.abs(
      max - min
    ) < 0.001
  ) {

    return formatNumberEUR(
      min
    );

  }


  return (
    formatNumberEUR(min)
    +
    " – "
    +
    formatNumberEUR(max)
  );

}



/* =====================================================
   RENDER DA PÁGINA
===================================================== */

function renderPage() {

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        filteredProducts.length
        /
        pageSize
      )
    );


  if (
    currentPage >
      totalPages
  ) {

    currentPage =
      totalPages;

  }


  const start =
    (
      currentPage - 1
    )
    *
    pageSize;


  const products =
    filteredProducts.slice(
      start,
      start + pageSize
    );


  renderProducts(
    products
  );


  renderPagination(
    totalPages
  );


  updateCounter();

}



/* =====================================================
   CARTÕES
===================================================== */

function renderProducts(products) {

  const catalog =
    document
      .getElementById(
        "catalog"
      );


  const message =
    document
      .getElementById(
        "message"
      );


  catalog.innerHTML =
    "";


  message.textContent =
    "";


  if (
    !products.length
  ) {

    message.textContent =
      "Não encontrámos artigos com esses critérios.";

    return;

  }


  products.forEach(
    product => {


      const name =
        product[
          "Produto"
        ] || "";


      const category =
        product[
          "Categoria"
        ] || "";


      const status =
        product[
          "Disponibilidade"
        ] || "Disponível";


      const image =
        (
          product.images &&
          product.images[0]
        )
        ||
        product["Imagem"]
        ||
        "";


      const card =
        document
          .createElement(
            "article"
          );


      card.className =
        "product";



      /* IMAGEM */

      const imageBox =
        document
          .createElement(
            "div"
          );


      imageBox.className =
        "image-box";


      if (category) {

        const badge =
          document
            .createElement(
              "span"
            );


        badge.className =
          "category-badge";


        badge.textContent =
          category;


        imageBox.appendChild(
          badge
        );

      }



      if (
        product.quantity > 1
      ) {

        const quantity =
          document
            .createElement(
              "span"
            );


        quantity.className =
          "quantity-badge";


        quantity.textContent =
          product.quantity
          +
          " unidades";


        imageBox.appendChild(
          quantity
        );

      }



      if (image) {

        const img =
          document
            .createElement(
              "img"
            );


        img.src =
          image;


        img.alt =
          name;


        img.loading =
          "lazy";


        img.decoding =
          "async";


        img.onerror =
          () => {

            img.remove();


            const fallback =
              document
                .createElement(
                  "span"
                );


            fallback.className =
              "no-image";


            fallback.textContent =
              "Imagem indisponível";


            imageBox.appendChild(
              fallback
            );

          };


        imageBox.appendChild(
          img
        );

      }

      else {

        const noImage =
          document
            .createElement(
              "span"
            );


        noImage.className =
          "no-image";


        noImage.textContent =
          "Sem imagem";


        imageBox.appendChild(
          noImage
        );

      }



      /* CORPO */

      const body =
        document
          .createElement(
            "div"
          );


      body.className =
        "product-body";


      const title =
        document
          .createElement(
            "h3"
          );


      title.className =
        "product-name";


      title.textContent =
        name;


      const footer =
        document
          .createElement(
            "div"
          );


      footer.className =
        "product-footer";


      const priceRow =
        document
          .createElement(
            "div"
          );


      priceRow.className =
        "price-row";


      const price =
        document
          .createElement(
            "span"
          );


      price.className =
        "price";


      price.textContent =
        getPriceLabel(
          product
        );


      const statusElement =
        document
          .createElement(
            "span"
          );


      statusElement.className =
        "status";


      statusElement.textContent =
        status;


      priceRow.appendChild(
        price
      );


      priceRow.appendChild(
        statusElement
      );


      footer.appendChild(
        priceRow
      );



      /* LINKS */

      const links =
        product.links || [];


      if (
        links.length === 1
      ) {

        const button =
          document
            .createElement(
              "a"
            );


        button.className =
          "product-button";


        button.href =
          links[0];


        button.target =
          "_blank";


        button.rel =
          "noopener noreferrer";


        button.textContent =
          "Ver artigo ↗";


        footer.appendChild(
          button
        );

      }


      else if (
        links.length > 1
      ) {

        const button =
          document
            .createElement(
              "button"
            );


        button.className =
          "product-button";


        button.textContent =
          "Ver "
          +
          links.length
          +
          " opções";


        const list =
          document
            .createElement(
              "div"
            );


        list.className =
          "links-list";


        links.forEach(
          (link,index) => {

            const anchor =
              document
                .createElement(
                  "a"
                );


            anchor.href =
              link;


            anchor.target =
              "_blank";


            anchor.rel =
              "noopener noreferrer";


            anchor.textContent =
              "Artigo "
              +
              (
                index + 1
              )
              +
              " ↗";


            list.appendChild(
              anchor
            );

          }
        );


        button.onclick =
          () => {

            list.classList.toggle(
              "open"
            );

          };


        footer.appendChild(
          button
        );


        footer.appendChild(
          list
        );

      }



      body.appendChild(
        title
      );


      body.appendChild(
        footer
      );


      card.appendChild(
        imageBox
      );


      card.appendChild(
        body
      );


      catalog.appendChild(
        card
      );

    }
  );

}



/* =====================================================
   PAGINAÇÃO
===================================================== */

function renderPagination(
  totalPages
) {

  const container =
    document
      .getElementById(
        "pagination"
      );


  container.innerHTML =
    "";


  if (
    totalPages <= 1
  ) {

    return;

  }


  createPageButton(
    "‹",
    currentPage - 1,
    currentPage === 1
  );


  const start =
    Math.max(
      1,
      currentPage - 2
    );


  const end =
    Math.min(
      totalPages,
      currentPage + 2
    );


  for (
    let page = start;
    page <= end;
    page++
  ) {

    createPageButton(
      page,
      page,
      false,
      page === currentPage
    );

  }


  createPageButton(
    "›",
    currentPage + 1,
    currentPage ===
      totalPages
  );

}



function createPageButton(
  label,
  page,
  disabled,
  active = false
) {

  const button =
    document
      .createElement(
        "button"
      );


  button.className =
    "page-button"
    +
    (
      active
        ? " active"
        : ""
    );


  button.textContent =
    label;


  button.disabled =
    disabled;


  button.onclick =
    () => {

      currentPage =
        page;


      renderPage();


      document
        .getElementById(
          "shop"
        )
        .scrollIntoView();

    };


  document
    .getElementById(
      "pagination"
    )
    .appendChild(
      button
    );

}



/* =====================================================
   CONTADOR
===================================================== */

function updateCounter() {

  const total =
    filteredProducts.length;


  const rawQuantity =
    filteredProducts.reduce(
      (
        sum,
        product
      ) =>
        sum
        +
        (
          product.quantity
          || 1
        ),
      0
    );


  let text =
    total
    +
    (
      total === 1
        ? " produto"
        : " produtos"
    );


  if (
    rawQuantity !== total
  ) {

    text +=
      " · "
      +
      rawQuantity
      +
      " unidades";

  }


  document
    .getElementById(
      "counter"
    )
    .textContent =
      text;

}



function updateHeroTotal() {

  const products =
    allProducts.length;


  const units =
    allProducts.reduce(
      (
        sum,
        product
      ) =>
        sum
        +
        (
          product.quantity
          || 1
        ),
      0
    );


  document
    .getElementById(
      "heroTotal"
    )
    .textContent =
      products
      +
      " produtos · "
      +
      units
      +
      " unidades disponíveis";

}



/* =====================================================
   EVENTOS
===================================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    function () {

      searchQuery =
        normalizeText(
          this.value
        );


      currentPage =
        1;


      applyFilters();

    }
  );



document
  .getElementById(
    "sortSelect"
  )
  .addEventListener(
    "change",
    function () {

      sortMode =
        this.value;


      currentPage =
        1;


      applyFilters();

    }
  );



document
  .getElementById(
    "pageSizeSelect"
  )
  .addEventListener(
    "change",
    function () {

      pageSize =
        Number(
          this.value
        );


      currentPage =
        1;


      renderPage();

    }
  );



/* =====================================================
   START
===================================================== */

loadConfig();

loadProducts();

</script>
